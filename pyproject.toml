[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bynn-decisionnode"
version = "0.4.0"
description = "The official Python client for DecisionNode, a decision engine that answers questions about text, JSON and images with calibrated probabilities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bynn Intelligence, Inc." }]
keywords = ["decisionnode", "decision-engine", "decision", "classification", "api", "sdk", "websocket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25,<1",
  "typing_extensions>=4.5",
  # Sessions (the WebSocket stream). Pinned exactly; imported on the first session only.
  "websockets==16.1.1",
]

[project.optional-dependencies]
# HTTP/2 for the API connection: pip install "bynn-decisionnode[http2]".
http2 = [
  "h2==4.4.1",
]

[project.urls]
Homepage = "https://decisionnode.com"
Repository = "https://github.com/Bynn-Intelligence/decision-node-python"
Changelog = "https://github.com/Bynn-Intelligence/decision-node-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "h2==4.4.1",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.hatch.build.targets.sdist]
# What is published and nothing else: the release workflow checks the built files
# against this list.
only-include = ["src/decisionnode", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/decisionnode"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
strict = true
files = ["src/decisionnode"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "UP031", "B904", "B905"]
