# Lint, type-check, unit tests and the SDK conformance suite on every push and pull
# request. This workflow builds the package to check that it builds; it never publishes.
#
# The conformance suite is checked out from Bynn-Intelligence/decision-node-conformance
# with the organisation secret DECISIONNODE_CONFORMANCE_TOKEN (read-only on that one
# repository), at the commit pinned in CONFORMANCE_REF below. The test run starts the
# suite's mock server and runs every case; it fails when the suite is missing.
#
# Supply chain: every action is pinned to a commit SHA (the release tag is in the
# comment), every checkout sets persist-credentials: false, and uv is installed at a
# pinned version.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The conformance suite commit this SDK is tested against (suite 1.11, for specification
  # 1.3). Change it here only.
  CONFORMANCE_REF: 5c9a14a03736521560954f6626cfd3b2bcd7c11b
  UV_VERSION: "0.7.13"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check out the conformance suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          token: ${{ secrets.DECISIONNODE_CONFORMANCE_TOKEN }}
          path: conformance
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      # The conformance tests start the suite's mock server (mock/server.py) and run
      # every case of every kind, with both clients.
      - name: Unit tests and the whole conformance suite
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: uv run pytest -ra

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - run: uv build
