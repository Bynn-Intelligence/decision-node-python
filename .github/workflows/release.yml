# Release: builds the package exactly as it is published and checks it on every push to
# main (a dry run that publishes nothing), and on a v* tag builds, checks and then
# publishes those same files to PyPI and creates the GitHub release.
#
# What the repository owner sets up, once, before the first tag:
#
#   GitHub environment "release" (Settings, Environments):
#     - Required reviewers: the people who approve a release. A publish job waits for one
#       of them.
#     - Deployment branches and tags: tags matching v* only.
#     - No secrets and no variables: PyPI is reached by trusted publishing (OIDC).
#
#   PyPI trusted publisher (pypi.org, Your projects, Publishing; for the first release a
#   "pending publisher", which creates the project on its first publish):
#     - PyPI project name: bynn-decisionnode
#     - Owner: Bynn-Intelligence
#     - Repository name: decision-node-python
#     - Workflow name: release.yml
#     - Environment name: release
#
#   The repository is public when a tag is published, so the release, its notes and the
#   PyPI project page link to a source a reader can open.
#
# A release: set the version in pyproject.toml and src/decisionnode/_version.py, give the
# CHANGELOG's top entry that version, push to main, wait for this workflow to pass there,
# then push the tag v<version> on that commit. The publish job runs only for a tag on a
# commit that is on main, and only after a reviewer approves the "release" environment.
#
# Supply chain: every action is pinned to a commit SHA (the release tag in the comment),
# every checkout sets persist-credentials: false, uv is installed at a pinned version,
# the dry run has no secrets and read-only contents, and only the publish job may request
# an OIDC token. The publish job uploads the dry run's own files; it never builds.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  UV_VERSION: "0.7.13"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - name: Build the sdist and the wheel
        run: uv build
      # On a tag, the version is the tag's; on main, the CHANGELOG's top entry.
      - name: The version the files must carry
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python .github/scripts/changelog_section.py --top)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "expected version: ${version}"
      - name: Check the built files
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python .github/scripts/check_dist.py dist
      - name: Check that the release notes exist
        run: python .github/scripts/changelog_section.py "${{ steps.version.outputs.version }}" > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing to PyPI, and nothing else asks for a token.
      id-token: write
      # The GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only a commit already on main is released: a tag pushed on any other branch, or on
      # a commit that never went through review, stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check the tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: The files to publish
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python .github/scripts/changelog_section.py "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
